<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studently | College Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>

    <!-- ============ LOGIN VIEW ============ -->
    <div id="loginView" class="login-wrap">
        <form id="loginForm" class="login-card">
            <div class="login-logo"><i data-lucide="graduation-cap"></i></div>
            <h2>Studently</h2>
            <p class="login-sub">College Management System</p>
            <div class="input-group">
                <i data-lucide="user"></i>
                <input type="text" id="loginUsername" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i data-lucide="lock"></i>
                <input type="password" id="loginPassword" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i data-lucide="log-in"></i> Login</button>
            <button type="button" class="link-btn" id="showForgotBtn">Forgot password?</button>
            <button type="button" class="link-btn" id="showRegisterBtn">New student? Create account</button>
        </form>

        <form id="registerForm" class="login-card hidden">
            <div class="login-logo"><i data-lucide="user-plus"></i></div>
            <h2>Student Registration</h2>
            <p class="login-sub">Create your account</p>
            <div class="input-group">
                <i data-lucide="user"></i>
                <input type="text" id="regName" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <i data-lucide="hash"></i>
                <input type="text" id="regRoll" placeholder="Roll Number" required>
            </div>
            <div class="input-group">
                <i data-lucide="book-open"></i>
                <select id="regCourse" class="input select-input"><option value="">Select Course</option></select>
            </div>
            <input type="text" id="regBranch" class="input" placeholder="Branch">
            <input type="number" id="regSemester" class="input" placeholder="Semester" min="1">
            <div class="input-group">
                <i data-lucide="at-sign"></i>
                <input type="email" id="regEmail" placeholder="Email (optional)">
            </div>
            <input type="text" id="regPhone" class="input" placeholder="Phone (optional)">
            <div class="input-group">
                <i data-lucide="user"></i>
                <input type="text" id="regUsername" placeholder="Choose a username (login)" required>
            </div>
            <div class="input-group">
                <i data-lucide="lock"></i>
                <input type="password" id="regPassword" placeholder="Create password (min 4 chars)" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i data-lucide="user-plus"></i> Create Account</button>
            <button type="button" class="link-btn" id="backToLogin2">Back to login</button>
        </form>

        <form id="forgotForm" class="login-card hidden">
            <div class="login-logo"><i data-lucide="key-round"></i></div>
            <h2>Reset Password</h2>
            <p class="login-sub">Enter username and a new password</p>
            <div class="input-group">
                <i data-lucide="user"></i>
                <input type="text" id="forgotUsername" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i data-lucide="lock"></i>
                <input type="password" id="forgotNewPass" placeholder="New Password" required>
            </div>
            <button type="submit" class="btn btn-warning btn-block"><i data-lucide="rotate-cw"></i> Reset Password</button>
            <button type="button" class="link-btn" id="backToLogin">Back to login</button>
        </form>
    </div>

    <!-- ============ APP VIEW ============ -->
    <div id="appView" class="app-shell hidden">
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo"><i data-lucide="graduation-cap"></i></div>
                <div class="brand-text">
                    <h1>Studently</h1>
                    <p>College Management Platform</p>
                </div>
            </div>
            <div class="header-right">
                <span class="status-pill"><span class="pulse-dot"></span> <span id="roleBadge">Admin</span></span>
                <div class="avatar" title="Account"><i data-lucide="user"></i></div>
                <span class="username-label" id="userName">—</span>
                <button id="logoutBtn" class="btn btn-secondary"><i data-lucide="log-out"></i> Logout</button>
            </div>
        </header>

        <nav id="tabNav" class="tab-nav"></nav>

        <main id="content" class="content-area"></main>
    </div>

    <div id="alertBox" class="alert hidden"></div>

    <script src="/static/script.js?v=4"></script>
</body>
</html>
